services:
  - type: web
    name: korean-series
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@kseries.com
      - key: ADMIN_PASSWORD
        value: Admin@12345
